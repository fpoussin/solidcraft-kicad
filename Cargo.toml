[package]
name = "solidcraft-kicad"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Import KiCad PCBs as native SolidCraft component assemblies"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
figment = { version = "0.10", features = ["toml"] }
i_triangle = "0.50.1"
kiutils_kicad = "0.3"
kiutils_sexpr = "0.1.1"
kurbo = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
solidcraft-engine = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
solidcraft-mcp = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
tempfile = "3"
thiserror = "2"
usvg = { version = "0.48.1", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
wait-timeout = "0.2"

# Upstream's kernel patches are part of the v0.15.0 dependency graph.
# Cargo only applies patches from the top-level manifest.
[patch.crates-io]
truck-geometry = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
truck-shapeops = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
truck-stepio = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
truck-meshalgo = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }
matext4cgmath = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.15.0" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
