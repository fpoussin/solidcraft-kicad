[package]
name = "solidcraft-kicad"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Import KiCad PCBs as native SolidCraft component assemblies"

[package.metadata.solidcraft]
# First desktop release that reads the embedded engine's native format.
minimum-version = "0.44.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6"
figment = { version = "0.10", features = ["toml"] }
flate2 = "1"
i_triangle = "0.50.1"
kiutils_kicad = "0.3"
kiutils_sexpr = "0.1.1"
kurbo = "0.13"
self-replace = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
solidcore-record = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.44.1" }
solidcraft-engine = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.44.1" }
solidcraft-mcp = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.44.1" }
solidcraft-viewport = { git = "https://github.com/tangency-labs/solidcraft.git", tag = "v0.44.1" }
tar = "0.4"
tempfile = "3"
thiserror = "2"
usvg = { version = "0.48.1", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
wait-timeout = "0.2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
semver = "1"
toml = "1"

# Upstream patches, when required, must match the engine release tag.
# SolidCraft 0.44.1 needs no crates.io patches in this dependency graph.
[patch.crates-io]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
