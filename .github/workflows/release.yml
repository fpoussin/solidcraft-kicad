name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait:
    name: Wait for main CI artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    permissions:
      contents: read
      actions: read
    outputs:
      run-id: ${{ steps.ci.outputs.run-id }}
      artifact-ids: ${{ steps.ci.outputs.artifact-ids }}
      commit: ${{ steps.ci.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag
        run: python3 scripts/release.py validate-tag "$GITHUB_REF_NAME"
      - name: Wait for the same commit on the default branch
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_BRANCH: ${{ github.event.repository.default_branch }}
        # Peel annotated/signed tags to the actual checked-out commit.
        run: python3 scripts/wait_for_ci.py --commit "$(git rev-parse HEAD)" --branch "$MAIN_BRANCH"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wait]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.wait.outputs.run-id }}
          artifact-ids: ${{ needs.wait.outputs.artifact-ids }}
          path: artifacts/release
          merge-multiple: true
      - name: Verify assets and prepare release notes
        env:
          RELEASE_COMMIT: ${{ needs.wait.outputs.commit }}
        run: python3 scripts/release.py prepare "$GITHUB_REF_NAME" --commit "$RELEASE_COMMIT"
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > artifacts/release/existing.json; then
            python3 -c 'import json; assert json.load(open("artifacts/release/existing.json"))["isDraft"], "Release already published"'
            gh release upload "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file artifacts/release/notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file artifacts/release/notes.md
