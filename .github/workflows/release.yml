name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and package
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify assets and prepare release notes
        run: python3 scripts/release.py prepare "$GITHUB_REF_NAME"
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > artifacts/release/existing.json; then
            python3 -c 'import json; assert json.load(open("artifacts/release/existing.json"))["isDraft"], "Release already published"'
            gh release upload "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file artifacts/release/notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file artifacts/release/notes.md
