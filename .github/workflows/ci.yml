name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      release:
        description: Build and package release binaries after testing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting and Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks
      - name: Validate release tag
        if: inputs.release
        run: python3 scripts/release.py validate-tag "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
            shell: bash
          - runner: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
            shell: bash
          # Standard GitHub-hosted runners remain free for this public repository.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: ${{ inputs.release || false }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # A packaging failure should not discard successful compilation.
          cache-on-failure: true
      - name: Test
        # Share optimized dependencies with the shipped binary instead of also
        # compiling the entire CAD engine in the debug profile.
        run: cargo test --locked --release --target "${{ matrix.target }}" --timings
      - name: Build release binary
        if: inputs.release
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin solidcraft-kicad --timings
      - name: Package and smoke-test binary
        if: inputs.release
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release.py package "${{ matrix.target }}"
      - name: Upload release archive
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
