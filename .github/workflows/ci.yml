name: CI and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting and Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py validate-tag "$GITHUB_REF_NAME"
      - run: cargo fmt --check
      - name: Test release packaging
        run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - runner: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
          # Standard GitHub-hosted runners remain free for this public repository.
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static -C linker=rust-lld -C linker-flavor=lld-link'
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$RELEASE_TARGET"
      - name: Configure Windows SDK for LLVM linker
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Test
        # Share optimized dependencies with the shipped binary instead of also
        # compiling the entire CAD engine in the debug profile.
        run: cargo test --locked --release --target "$RELEASE_TARGET" --timings
      - name: Build release binary
        run: cargo build --locked --release --target "$RELEASE_TARGET" --bin solidcraft-kicad --timings
      - name: Package and smoke-test binary
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release.py package "$RELEASE_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: artifacts/release
          merge-multiple: true
      - name: Verify assets and prepare release notes
        run: python3 scripts/release.py prepare "$GITHUB_REF_NAME"
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > artifacts/release/existing.json; then
            python3 -c 'import json; assert json.load(open("artifacts/release/existing.json"))["isDraft"], "Release already published"'
            gh release upload "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/release/*.tar.gz artifacts/release/*.zip artifacts/release/SHA256SUMS \
              --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file artifacts/release/notes.md
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file artifacts/release/notes.md
