name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Formatting and Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: checks
      - run: cargo fmt --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: ''
            shell: bash
          - runner: macos-15
            target: aarch64-apple-darwin
            rustflags: ''
            shell: bash
          # Standard GitHub-hosted runners remain free for this public repository.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      RELEASE_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: ${{ github.event_name == 'push' }}
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          # A packaging failure should not discard successful compilation.
          cache-on-failure: true
      - name: Test
        # Share optimized dependencies with the shipped binary instead of also
        # compiling the entire CAD engine in the debug profile.
        run: cargo test --locked --release --target "${{ matrix.target }}" --timings
      - name: Install KiCad for demo acceptance
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          if ! sudo apt-get -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update; then
            echo "::warning::Launchpad HTTPS content host failed; retrying its signed archive over HTTP"
            sudo find /etc/apt/sources.list.d -type f \
              \( -name '*.list' -o -name '*.sources' \) \
              -exec sed -i \
                's|https://ppa.launchpadcontent.net/kicad/kicad-10.0-releases/ubuntu|http://ppa.launchpad.net/kicad/kicad-10.0-releases/ubuntu|g' \
                {} +
            sudo apt-get -o Acquire::Retries=2 -o APT::Update::Error-Mode=any update
          fi
          sudo apt-get install --yes --no-install-recommends kicad
          version="$(kicad-cli version)"
          case "$version" in
            10.*) printf 'Using KiCad %s\n' "$version" ;;
            *) echo "Expected KiCad 10, got $version" >&2; exit 1 ;;
          esac
      - name: Test bundled demo with real KiCad exports
        if: runner.os == 'Linux'
        run: |
          python3 scripts/fetch_demo_models.py
          cargo test --locked --release --target "${{ matrix.target }}" --test demo -- --ignored
      - name: Build release binary
        if: github.event_name == 'push'
        run: cargo build --locked --release --target "${{ matrix.target }}" --bin solidcraft-kicad --timings
      - name: Package and smoke-test binary
        if: github.event_name == 'push'
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} scripts/release.py package "${{ matrix.target }}"
      - name: Upload release archive
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true
      - name: Upload build timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 14
